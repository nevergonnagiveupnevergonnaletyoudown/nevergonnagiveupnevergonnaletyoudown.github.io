<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NV</title>
<meta property="og:title" content="NV">
<meta property="og:description" content="some shitty things">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   색: 인광 초록 하나로 밀고, 경고/각주에만 호박색을 쓴다.
   단색 화면이라 "밝기 차이"만으로 위계를 만들어야 함.
   ========================================================= */
:root{
  --bg:#030A06;
  --screen:#06160D;
  --phos:#2CFF88;        /* 가장 밝은 초록 = 중요한 것 */
  --phos-mid:#17B85F;    /* 중간 밝기 = 보조 정보 */
  --phos-dim:#0C7A3E;    /* 어두운 초록 = 선, 배경 */
  --amber:#FFB63C;       /* 이 화면에서 유일하게 초록이 아닌 색 */
  --mono:"Share Tech Mono", "Nanum Gothic Coding", monospace;
  --kor:"Nanum Gothic Coding", "Share Tech Mono", monospace;
}

*{ box-sizing:border-box; }

html,body{ height:100%; }

body{
  margin:0;
  background:var(--bg);
  color:var(--phos);
  font-family:var(--mono);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background-image:radial-gradient(ellipse at center, #0A1F12 0%, #030A06 70%);
}

/* =========================================================
   1) 부팅 로그 화면
   초록 단말기가 아니라 일부러 회색 CMD 톤으로 간다.
   그래야 뒤에 초록 화면이 켜질 때 대비가 살아남.
   ========================================================= */
.bootscreen{
  position:fixed;
  inset:0;
  z-index:50;
  background:#000;
  color:#C9D3C9;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.6;
  padding:22px 18px;
  overflow:hidden;
}
.bootscreen pre{
  margin:0;
  font:inherit;
  white-space:pre-wrap;
  word-break:break-all;
}
.bootscreen .ok{ color:#8FE3A8; }
.bootscreen .warn{ color:var(--amber); }

.caret{ animation:blink 1s steps(1) infinite; }

.skiphint{
  position:absolute;
  right:18px;
  bottom:16px;
  font-size:11px;
  color:#49544A;
  opacity:0;
  transition:opacity .5s;
}
.skiphint.on{ opacity:1; }

/* 켜지는 순간의 흰 섬광 */
.flash{
  position:fixed;
  inset:0;
  z-index:40;
  background:#E6FFF0;
  opacity:0;
  pointer-events:none;
}
.flash.on{ animation:flashOut .45s ease-out forwards; }
@keyframes flashOut{
  0%  { opacity:.85; }
  100%{ opacity:0; }
}

/* =========================================================
   2) 단말기 화면
   ========================================================= */
.screen{
  position:relative;
  width:min(620px, 100%);
  background:var(--screen);
  border:2px solid var(--phos-dim);
  border-radius:14px;
  padding:22px 24px 18px;
  overflow:hidden;
  box-shadow:0 0 60px rgba(44,255,136,.14), inset 0 0 70px rgba(44,255,136,.06);
  text-shadow:0 0 6px currentColor;  /* 글자가 번지는 인광 효과 */
  visibility:hidden;                 /* 부팅이 끝나기 전엔 감춤 */
}
.screen.on{ visibility:visible; }

/* TV 켜지는 연출.
   scaleY 를 0에 가깝게 눌러두면 그 자체가 가로 한 줄처럼 보인다.
   거기에 brightness 를 올려서 흰 선으로 만들고, 위아래로 펼친다. */
.screen.on.tv{
  transform-origin:center;
  animation:tvOn .7s cubic-bezier(.16,.9,.16,1) forwards;
}
@keyframes tvOn{
  0%  { transform:scaleY(.005) scaleX(.55); filter:brightness(16) saturate(0); }
  20% { transform:scaleY(.005) scaleX(1);   filter:brightness(16) saturate(0); }
  45% { transform:scaleY(.05)  scaleX(1);   filter:brightness(12) saturate(.2); }
  72% { transform:scaleY(1)    scaleX(1);   filter:brightness(3.4); }
  88% { filter:brightness(1.35); }
  100%{ transform:scaleY(1)    scaleX(1);   filter:brightness(1); }
}

/* 스캔라인: 1px 어두운 줄을 3px 간격으로 화면 전체에 덮는다 */
.screen::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;              /* 클릭이 이 레이어에 막히면 안 됨 */
  background:repeating-linear-gradient(
    rgba(0,0,0,.30) 0 1px,
    transparent 1px 3px
  );
  animation:flicker 4s steps(60) infinite;
}
@keyframes flicker{
  0%,100%{ opacity:.55; }
  47%    { opacity:.62; }
  48%    { opacity:.38; }  /* 아주 가끔 한 번 튀는 게 진짜처럼 보임 */
  49%    { opacity:.60; }
}

/* ---------- 상단 ---------- */
.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:1px solid var(--phos-dim);
  padding-bottom:10px;
  margin-bottom:16px;
}
.name{
  font-size:40px;
  line-height:.9;
  letter-spacing:.06em;
}
.name sup{
  font-size:16px;
  color:var(--amber);
  text-shadow:0 0 6px var(--amber);
}
.meta{
  text-align:right;
  font-size:12px;
  color:var(--phos-mid);
  line-height:1.6;
}

/* ---------- 목록 ---------- */
.head{
  font-size:12px;
  color:var(--phos-mid);
  margin-bottom:8px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:11px 12px;
  border:none;
  background:none;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  border-left:3px solid transparent;
}
/* 선택된 항목은 색을 반전시킨다 — 옛날 터미널이 쓰던 방식 */
.item.sel{
  background:var(--phos);
  color:var(--screen);
  border-left-color:var(--amber);
  text-shadow:none;
}
.item.locked{ color:var(--phos-dim); }
.item.locked.sel{ background:var(--phos-dim); color:var(--screen); }
.item.done{ color:var(--phos-dim); cursor:not-allowed; }

.num{ font-size:12px; opacity:.75; width:28px; flex:none; }
.body-txt{ flex:1; min-width:0; }
.t{ font-size:17px; }
.d{ font-size:12px; opacity:.8; font-family:var(--kor); margin-top:2px; }
.tag{ font-size:12px; flex:none; }

/* ---------- 하단 ---------- */
.bottom{
  margin-top:16px;
  padding-top:10px;
  border-top:1px solid var(--phos-dim);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:12px;
  color:var(--phos-mid);
  flex-wrap:wrap;
}
.note{
  margin-top:12px;
  font-family:var(--kor);
  font-size:12px;
  color:var(--phos-mid);
}
.note b{ color:var(--amber); font-weight:400; text-shadow:0 0 6px var(--amber); }

@keyframes blink{ 50%{ opacity:0; } }

/* 움직임을 줄여달라고 설정한 사람에겐 전부 끈다 */
@media (prefers-reduced-motion: reduce){
  .screen::after, .caret{ animation:none; }
  .screen.on.tv{ animation:none; }
  .flash.on{ animation:none; }
}

@media (max-width:420px){
  .name{ font-size:32px; }
  .t{ font-size:15px; }
  .bootscreen{ font-size:11px; }
}
</style>
</head>
<body>

<!-- 부팅 로그가 찍히는 검은 화면 -->
<div class="bootscreen" id="bootscreen">
  <pre id="bootlog"></pre>
  <div class="skiphint" id="skiphint">press any key to skip</div>
</div>

<!-- 켜지는 순간 번쩍이는 레이어 -->
<div class="flash" id="flash"></div>

<main class="screen" id="screen">

  <div class="top">
    <div class="name">NV<sup>*</sup></div>
    <div class="meta">
      Device<br>
      <span id="uptime">jk things</span>
    </div>
  </div>

  <div class="head">&gt; Archived Projects</div>

  <button class="item" data-go="songs.html">
    <span class="num">001</span>
    <span class="body-txt">
      <span class="t">SONGS</span>
      <span class="d">My ai songs</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <button class="item done" disabled>
    <span class="num">002</span>
    <span class="body-txt">
      <span class="t">RHYTHM</span>
      <span class="d">4k Rhythmgame things maybe</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <button class="item locked" data-go="schedule.html">
    <span class="num">003</span>
    <span class="body-txt">
      <span class="t">██████</span>
      <span class="d">No Permission</span>
    </span>
    <span class="tag">[LOCKED]</span>
  </button>

  <div class="bottom">
    <span>↑↓ move · ENTER execute</span>
    <span id="clock">--:--:--</span>
  </div>

  <p class="note"><b>*</b> jk things.</p>

</main>

<script>
/* =========================================================
   ★ 연출 속도 조절
   ========================================================= */
const CHAR_DELAY = 28;    // 타이핑 한 글자 간격(ms). 크게 하면 느려짐
const LINE_DELAY = 110;   // 줄이 툭 뜨는 간격(ms)
const PROMPT_WAIT = 240;  // 명령어 입력 후 멈추는 시간(ms)

/* 부팅 로그 내용.
   ['type', 글자]   → 한 글자씩 타이핑
   ['line', 글자, 색] → 줄 단위로 툭 출력 ('ok' 초록 / 'warn' 호박)
   ['wait', ms]     → 그냥 멈춤
   ========================================================= */
const SEQ = [
  ['wait', 380],
  ['type', 'C:\\NV> systemcheck'],
  ['wait', PROMPT_WAIT],
  ['line', 'Power supply ........... ONLINE', 'ok'],
  ['line', 'Storage link ........... CONNECTED', 'ok'],
  ['line', 'Audio device ........... READY', 'ok'],
  ['line', 'User authentication ... AUTHORIZED maybe idk bro', 'anyway ok i dont care'],
  ['line', ''],

  ['type', 'C:\\NV> mount song_list'],
  ['wait', PROMPT_WAIT],
  ['line', '7 audio files indexed'],
  ['line', ''],

  ['type', 'C:\\NV> decrypt entry_003'],
  ['wait', PROMPT_WAIT],
  ['line', 'decrypting ............. FAILED', 'warn'],
  ['line', 'WARNING: 1 entry remains locked dont mind that plz', 'warn'],
  ['line', ''],

  ['type', 'C:\\NV> run terminal.exe'],
  ['wait', PROMPT_WAIT],
  ['line', 'loading directory ...... OK', 'ok'],
  ['line', ''],
  ['line', 'STARTING NV TERMINAL'],
  ['wait', 520]
];

const bootscreen = document.getElementById('bootscreen');
const bootlog    = document.getElementById('bootlog');
const skiphint   = document.getElementById('skiphint');
const flash      = document.getElementById('flash');
const screenEl   = document.getElementById('screen');

const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 이 탭에서 이미 부팅을 봤는지 확인.
   sessionStorage 는 탭을 닫으면 사라져서, songs 갔다 돌아올 때는 생략된다.
   (localStorage 를 쓰면 영원히 안 나오니까 일부러 이걸 씀) */
let alreadyBooted = false;
try{ alreadyBooted = sessionStorage.getItem('nv-booted') === '1'; }catch(e){}

let aborted = false;
let done = false;

function sleep(ms){
  return new Promise(r => setTimeout(r, aborted ? 0 : ms));
}

/* 한 글자씩 찍는다. 뒤에 깜빡이는 커서를 붙여둠 */
async function typeLine(text){
  const span = document.createElement('span');
  const caret = document.createElement('span');
  caret.className = 'caret';
  caret.textContent = '_';
  bootlog.appendChild(span);
  bootlog.appendChild(caret);

  for(const ch of text){
    if(aborted){ span.textContent = text; break; }
    span.textContent += ch;
    await sleep(CHAR_DELAY);
  }
  caret.remove();
  bootlog.appendChild(document.createTextNode('\n'));
}

function putLine(text, cls){
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = text;
  bootlog.appendChild(span);
  bootlog.appendChild(document.createTextNode('\n'));
}

/* 화면 켜기 */
function powerOn(animate){
  if(done) return;
  done = true;

  bootscreen.style.display = 'none';
  screenEl.classList.add('on');

  if(animate){
    screenEl.classList.add('tv');
    flash.classList.add('on');
  }

  try{ sessionStorage.setItem('nv-booted', '1'); }catch(e){}
}

async function runBoot(){
  for(const step of SEQ){
    if(aborted) break;
    const [kind, a, b] = step;
    if(kind === 'wait')      await sleep(a);
    else if(kind === 'type') await typeLine(a);
    else{ putLine(a, b); await sleep(LINE_DELAY); }
  }
  powerOn(!noMotion);
}

/* 아무 키나 클릭하면 건너뛴다 */
function skip(){
  if(done) return;
  aborted = true;
  powerOn(!noMotion);
}

if(alreadyBooted || noMotion){
  /* 이미 봤거나 움직임 최소화 설정이면 바로 켠다 */
  powerOn(false);
}else{
  document.addEventListener('keydown', skip);
  document.addEventListener('pointerdown', skip);
  setTimeout(() => { if(!done) skiphint.classList.add('on'); }, 1400);
  runBoot();
}


/* =========================================================
   목록 — 키보드로 위아래 이동
   ========================================================= */
const items = Array.from(document.querySelectorAll('.item:not([disabled])'));
let sel = 0;

function draw(){
  document.querySelectorAll('.item').forEach(el => el.classList.remove('sel'));
  items[sel].classList.add('sel');
}
draw();

function move(step){
  sel = (sel + step + items.length) % items.length;  // 끝에서 반대편으로 돌아감
  draw();
}

function open(){
  const url = items[sel].dataset.go;
  if(url) window.location.href = url;
}

document.addEventListener('keydown', e => {
  if(!done) return;                  // 부팅 중엔 목록 조작 안 되게
  if(e.key === 'ArrowDown' || e.key === 's'){ e.preventDefault(); move(1); }
  if(e.key === 'ArrowUp'   || e.key === 'w'){ e.preventDefault(); move(-1); }
  if(e.key === 'Enter'){ open(); }
});

items.forEach((el, i) => {
  el.addEventListener('mouseenter', () => { sel = i; draw(); });
  el.addEventListener('click', () => { sel = i; open(); });
});


/* =========================================================
   시계와 날짜 계산
   ========================================================= */
const START = new Date(2026, 8, 18);   // 웹개발 시작한 날 (월은 0부터라 8 = 9월)

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);

  const days = Math.floor((now - START) / 86400000) + 1;
  document.getElementById('uptime').textContent = 'Its been since I started this stupid business:' + days + 'day';
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
