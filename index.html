<!-- 공통 스타일. style.css 를 고쳤는데 화면이 안 바뀌면
     아래 v=3 을 v=4 로 올리면 된다. -->
<link rel="stylesheet" href="style.css?v=3">

<style>
/* 이 페이지에서만 쓰는 것들 — 부팅 연출 */

/* ---------- 부팅 로그 화면 ----------
   초록 단말기가 아니라 일부러 회색 CMD 톤으로 간다.
   그래야 뒤에 초록 화면이 켜질 때 대비가 살아남. */
.bootscreen{
  position:fixed;
  inset:0;
  z-index:50;
  background:#000;
  color:#C9D3C9;
  font-family:var(--mono);
  font-size:13px;
  line-height:1.6;
  padding:22px 18px;
  overflow:hidden;
}
.bootscreen pre{
  margin:0;
  font:inherit;
  white-space:pre-wrap;
  word-break:break-all;
}
.bootscreen .ok{ color:#8FE3A8; }
.bootscreen .warn{ color:var(--amber); }

.caret{ animation:blink 1s steps(1) infinite; }

.skiphint{
  position:absolute;
  right:18px;
  bottom:16px;
  font-size:11px;
  color:#49544A;
  opacity:0;
  transition:opacity .5s;
}
.skiphint.on{ opacity:1; }

/* ---------- 켜지는 순간의 흰 섬광 ----------
   너무 눈부시면 아래 .85 를 .5 정도로 낮추면 된다. */
.flash{
  position:fixed;
  inset:0;
  z-index:40;
  background:#E6FFF0;
  opacity:0;
  pointer-events:none;
}
.flash.on{ animation:flashOut .45s ease-out forwards; }
@keyframes flashOut{
  0%  { opacity:.85; }
  100%{ opacity:0; }
}

/* ---------- TV 켜지는 연출 ----------
   scaleY 를 0에 가깝게 눌러두면 그 자체가 가로 한 줄처럼 보인다.
   거기에 brightness 를 올려서 흰 선으로 만들고, 위아래로 펼친다.

   ★ .tv 클래스는 연출이 끝나면 JS 가 떼어낸다.
     안 떼면 이 animation 이 계속 .screen 을 붙잡고 있어서
     나중에 지직이 터질 때 흔들림(fx-shake)이 안 먹는다. */
.screen{ visibility:hidden; }        /* 부팅이 끝나기 전엔 감춤 */
.screen.on{ visibility:visible; }
.screen.on.tv{
  transform-origin:center;
  animation:tvOn .7s cubic-bezier(.16,.9,.16,1) forwards;
}
@keyframes tvOn{
  0%  { transform:scaleY(.005) scaleX(.55); filter:brightness(16) saturate(0); }
  20% { transform:scaleY(.005) scaleX(1);   filter:brightness(16) saturate(0); }
  45% { transform:scaleY(.05)  scaleX(1);   filter:brightness(12) saturate(.2); }
  72% { transform:scaleY(1)    scaleX(1);   filter:brightness(3.4); }
  88% { filter:brightness(1.35); }
  100%{ transform:scaleY(1)    scaleX(1);   filter:brightness(1); }
}

@media (prefers-reduced-motion: reduce){
  .caret{ animation:none; }
  .screen.on.tv{ animation:none; }
  .flash.on{ animation:none; }
}

@media (max-width:420px){
  .bootscreen{ font-size:11px; }
}

/* ---------- 숨겨진 000 항목 ----------
   .item 에 display:flex 가 걸려 있어서, 그냥 .secret 만 쓰면
   누가 이기는지 애매해진다. 클래스 두 개를 붙여 확실히 이기게 함. */
.item.secret{ display:none; }

/* 풀렸을 때 한 번 번쩍이는 연출 */
.item.reveal{ animation:revealIn .9s ease-out; }
@keyframes revealIn{
  0%  { opacity:0; transform:translateX(-10px); color:var(--amber); }
  40% { opacity:1; color:var(--amber); }
  100%{ opacity:1; transform:none; }
}
@media (prefers-reduced-motion: reduce){
  .item.reveal{ animation:none; }
}
</style>
</head>
<body>

<!-- 부팅 로그가 찍히는 검은 화면 -->
<div class="bootscreen" id="bootscreen">
  <pre id="bootlog"></pre>
  <div class="skiphint" id="skiphint">press any key to skip</div>
</div>

<!-- 켜지는 순간 번쩍이는 레이어 -->
<div class="flash" id="flash"></div>

<main class="screen" id="screen">

  <div class="top">
    <div class="name">NV<sup>*</sup></div>
    <div class="meta">
      Device<br>
      <span id="uptime">jk things</span>
    </div>
  </div>

  <div class="head">&gt; Archived Projects</div>

  <!-- 숨겨진 항목. 암호를 치기 전까진 .secret 때문에 안 보인다.
       화면에 안 보여도 HTML 소스에는 남아 있으니,
       소스 뒤져보는 사람한텐 어차피 들킨다. 그건 그거대로 상관없음. -->
  <button class="item secret" id="secretItem" data-go="origin.html">
    <span class="num">000</span>
    <span class="body-txt">
      <span class="t">ORIGIN</span>
      <span class="d">why this thing exists</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <button class="item" data-go="songs.html">
    <span class="num">001</span>
    <span class="body-txt">
      <span class="t">SONGS</span>
      <span class="d">My ai songs</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <button class="item done" disabled>
    <span class="num">002</span>
    <span class="body-txt">
      <span class="t">RHYTHM</span>
      <span class="d">4k Rhythmgame things maybe</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <!-- 새로 추가한 잡동사니 칸 -->
  <button class="item" data-go="misc.html">
    <span class="num">003</span>
    <span class="body-txt">
      <span class="t">MISC</span>
      <span class="d">Random small junk to mess with</span>
    </span>
    <span class="tag">[Execute]</span>
  </button>

  <button class="item locked" data-go="schedule.html">
    <span class="num">004</span>
    <span class="body-txt">
      <span class="t">██████</span>
      <span class="d">No Permission</span>
    </span>
    <span class="tag">[LOCKED]</span>
  </button>

  <div class="bottom">
    <span>↑↓ move · ENTER execute</span>
    <span id="clock">--:--:--</span>
  </div>

  <p class="note"><b>*</b> jk things.</p>

</main>

<script>
/* =========================================================
   ★ 연출 속도 조절
   ========================================================= */
const CHAR_DELAY = 28;    // 타이핑 한 글자 간격(ms). 크게 하면 느려짐
const LINE_DELAY = 110;   // 줄이 툭 뜨는 간격(ms)
const PROMPT_WAIT = 240;  // 명령어 입력 후 멈추는 시간(ms)

/* 부팅 로그 내용.
   ['type', 글자]     → 한 글자씩 타이핑
   ['line', 글자, 색] → 줄 단위로 툭 출력
   ['wait', ms]       → 그냥 멈춤

   ★ 세 번째 칸은 화면에 안 보이는 "색 이름"이다.
     'ok'   → 초록
     'warn' → 호박색
     비워두면 → 기본 회색
     글자를 더 넣고 싶으면 두 번째 칸에 이어 쓸 것.
   ========================================================= */
const SEQ = [
  ['wait', 380],
  ['type', 'C:\\NV> systemcheck'],
  ['wait', PROMPT_WAIT],
  ['line', 'Power supply ........... ONLINE', 'ok'],
  ['line', 'Storage link ........... CONNECTED', 'ok'],
  ['line', 'Audio device ........... READY', 'ok'],
  ['line', 'User authentication ... AUTHORIZED maybe idk bro', 'anyway ok i dont care'],
  ['line', ''],

  ['type', 'C:\\NV> mount song_list'],
  ['wait', PROMPT_WAIT],
  ['line', '7 audio files indexed'],
  ['line', ''],

  ['type', 'C:\\NV> decrypt entry_004'],
  ['wait', PROMPT_WAIT],
  ['line', 'decrypting ............. FAILED', 'warn'],
  ['line', 'WARNING: 1 entry remains locked dont mind that plz', 'warn'],
  ['line', ''],

  ['type', 'C:\\NV> run terminal.exe'],
  ['wait', PROMPT_WAIT],
  ['line', 'loading directory ...... OK', 'ok'],
  ['line', ''],
  ['line', 'STARTING NV TERMINAL'],
  ['wait', 520]
];

const bootscreen = document.getElementById('bootscreen');
const bootlog    = document.getElementById('bootlog');
const skiphint   = document.getElementById('skiphint');
const flash      = document.getElementById('flash');
const screenEl   = document.getElementById('screen');

const noMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* 이 탭에서 이미 부팅을 봤는지 확인.
   sessionStorage 는 탭을 닫으면 사라져서, 다른 페이지 갔다 돌아올 땐 생략된다.
   (localStorage 를 쓰면 영원히 안 나오니까 일부러 이걸 씀) */
let alreadyBooted = false;
try{ alreadyBooted = sessionStorage.getItem('nv-booted') === '1'; }catch(e){}

let aborted = false;
let done = false;

function sleep(ms){
  return new Promise(r => setTimeout(r, aborted ? 0 : ms));
}

/* 한 글자씩 찍는다. 뒤에 깜빡이는 커서를 붙여둠 */
async function typeLine(text){
  const span = document.createElement('span');
  const caret = document.createElement('span');
  caret.className = 'caret';
  caret.textContent = '_';
  bootlog.appendChild(span);
  bootlog.appendChild(caret);

  for(const ch of text){
    if(aborted){ span.textContent = text; break; }
    span.textContent += ch;
    await sleep(CHAR_DELAY);
  }
  caret.remove();
  bootlog.appendChild(document.createTextNode('\n'));
}

function putLine(text, cls){
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = text;
  bootlog.appendChild(span);
  bootlog.appendChild(document.createTextNode('\n'));
}

/* 화면 켜기 */
function powerOn(animate){
  if(done) return;
  done = true;

  bootscreen.style.display = 'none';
  screenEl.classList.add('on');

  if(animate){
    screenEl.classList.add('tv');
    flash.classList.add('on');

    /* ★ TV 켜지는 연출이 끝나면 .tv 를 떼어낸다.
       이 클래스가 남아 있으면 .screen.on.tv 의 animation 이
       계속 우선권을 쥐고 있어서, 나중에 지직이 터질 때
       fx-shake 가 무시된다. (지금은 흔들림이 0 이라 티는 안 나지만
       fx.js 에서 SHAKE 를 올리면 바로 체감된다) */
    screenEl.addEventListener('animationend', function off(e){
      if(e.animationName !== 'tvOn') return;
      screenEl.classList.remove('tv');
      screenEl.removeEventListener('animationend', off);
    });
  }

  /* 부팅용 리스너는 역할이 끝났으니 떼어낸다 */
  document.removeEventListener('keydown', skip);
  document.removeEventListener('pointerdown', skip);

  try{ sessionStorage.setItem('nv-booted', '1'); }catch(e){}
}

async function runBoot(){
  for(const step of SEQ){
    if(aborted) break;
    const [kind, a, b] = step;
    if(kind === 'wait')      await sleep(a);
    else if(kind === 'type') await typeLine(a);
    else{ putLine(a, b); await sleep(LINE_DELAY); }
  }
  powerOn(!noMotion);
}

/* 아무 키나 클릭하면 건너뛴다.
   ★ stopImmediatePropagation 이 핵심.
   이게 없으면 Enter 로 건너뛴 순간, 같은 Enter 가 아래의
   목록 리스너까지 흘러가서 001 번이 바로 실행돼버린다. */
function skip(e){
  if(done) return;
  if(e) e.stopImmediatePropagation();
  aborted = true;
  powerOn(!noMotion);
}

if(alreadyBooted || noMotion){
  powerOn(false);                 // 이미 봤으면 바로 켜기
}else{
  document.addEventListener('keydown', skip);
  document.addEventListener('pointerdown', skip);
  setTimeout(() => { if(!done) skiphint.classList.add('on'); }, 1400);
  runBoot();
}


/* =========================================================
   목록 — 키보드로 위아래 이동
   ========================================================= */
/* 숨겨진 항목이 나중에 합류할 수 있어서 const 가 아니라 let 이다.
   .secret 이 붙어 있는 동안은 목록에서 빠진다. */
let items = [];
let sel = 0;

function refreshItems(){
  const keep = items[sel];        // 보고 있던 줄을 기억해둔다
  items = Array.from(document.querySelectorAll('.item:not([disabled]):not(.secret)'));
  const i = items.indexOf(keep);
  sel = i >= 0 ? i : 0;           // 못 찾으면 맨 위로
}
refreshItems();

function draw(){
  document.querySelectorAll('.item').forEach(el => el.classList.remove('sel'));
  if(items[sel]) items[sel].classList.add('sel');
}
draw();

function move(step){
  sel = (sel + step + items.length) % items.length;  // 끝에서 반대편으로 돌아감
  draw();
}

/* open 이라는 이름은 브라우저에 이미 window.open 으로 있어서
   그대로 쓰면 덮어써버린다. 그래서 다른 이름을 쓴다. */
function openSelected(){
  if(!items[sel]) return;
  const url = items[sel].dataset.go;
  if(url) window.location.href = url;
}

document.addEventListener('keydown', e => {
  if(!done) return;                  // 부팅 중엔 목록 조작 안 되게
  if(e.key === 'ArrowDown' || e.key === 's'){ e.preventDefault(); move(1); }
  if(e.key === 'ArrowUp'   || e.key === 'w'){ e.preventDefault(); move(-1); }
  if(e.key === 'Enter'){ openSelected(); }
});

/* 숨은 항목에도 미리 달아둔다. 순서(i)를 고정해서 기억하면
   나중에 목록이 바뀌었을 때 엉뚱한 줄이 열린다.
   그래서 누를 때마다 indexOf 로 지금 위치를 다시 찾는다. */
document.querySelectorAll('.item').forEach(el => {
  el.addEventListener('mouseenter', () => {
    const i = items.indexOf(el);
    if(i >= 0){ sel = i; draw(); }
  });
  el.addEventListener('click', () => {
    const i = items.indexOf(el);
    if(i >= 0){ sel = i; openSelected(); }
  });
});


/* =========================================================
   숨겨진 항목 — 아무 데서나 CODE 를 타이핑하면 열린다

   ★ capture: true 가 핵심이다.
     부팅 스킵 함수(skip)가 stopImmediatePropagation 으로
     키 이벤트를 끊어버리기 때문에, 평범하게 달면
     부팅 중에 친 글자는 여기까지 오지도 못한다.
     capture 는 이벤트가 내려갈 때 먼저 잡는 단계라서
     끊기기 전에 글자를 받아낼 수 있다.
   ========================================================= */
const CODE = 'origin';
let buf = '';

function unlock(animate){
  const el = document.getElementById('secretItem');
  if(!el || !el.classList.contains('secret')) return;   // 이미 열려 있음

  el.classList.remove('secret');
  if(animate) el.classList.add('reveal');

  refreshItems();
  if(animate){
    sel = items.indexOf(el);        // 방금 찾았으면 거기에 커서를 둔다
    draw();
  }

  /* 한 번 찾으면 계속 열어둔다.
     sessionStorage 를 쓰면 탭 닫을 때마다 다시 찾아야 해서
     여기선 영구 보관인 localStorage 를 쓴다. */
  try{ localStorage.setItem('nv-origin', '1'); }catch(e){}
}

// 예전에 찾은 적 있으면 조용히 열어둔다
try{ if(localStorage.getItem('nv-origin') === '1') unlock(false); }catch(e){}

document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length !== 1) return;                 // 화살표, Enter 같은 건 무시

  // 최근 친 글자만 CODE 길이만큼 들고 있는다
  buf = (buf + e.key.toLowerCase()).slice(-CODE.length);
  if(buf === CODE) unlock(true);
}, true);


/* ---------- F12 콘솔에 남기는 힌트 ----------
   %c 는 뒤에 오는 문자열을 CSS 로 꾸며준다는 뜻이다. */
console.log('%c NV TERMINAL ',
  'background:#2CFF88;color:#030A06;font-weight:bold;padding:2px 6px');
console.log('%c> ls -a',            'color:#17B85F');
console.log('%c  4 entries shown. 5 exist.', 'color:#0C7A3E');
console.log('%c  the missing one is where all of this started.', 'color:#0C7A3E');
console.log('%c  six letters. just type it.', 'color:#FFB63C');


/* =========================================================
   시계와 날짜 계산
   ========================================================= */
const START = new Date(2026, 8, 18);   // 웹개발 시작한 날 (월은 0부터라 8 = 9월)

function tick(){
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);

  const days = Math.floor((now - START) / 86400000) + 1;
  document.getElementById('uptime').textContent = 'Its been since I started this stupid business:' + days + ' day';
}
tick();
setInterval(tick, 1000);
</script>

<!-- CRT 지직 효과. 숫자는 fx.js 맨 위에서 고친다.
     고쳤는데 안 바뀌면 아래 v=1 을 v=2 로 올릴 것. -->
<script src="fx.js?v=1"></script>
