<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NV / AUDIO</title>
<meta property="og:title" content="NV — Audio Archive">
<meta property="og:description" content="7 tracks">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

<!-- 공통 스타일.
     ★ 뒤의 v= 숫자는 모든 페이지가 똑같아야 한다.
       한 페이지만 다르면 그 페이지는 옛날 style.css 를 계속 쓴다. -->
<link rel="stylesheet" href="style.css?v=3">

<!-- CRT 지직 효과. .screen 이 있는 페이지면 어디든 이 한 줄이면 된다.
     defer 는 "이거 받느라 화면 그리는 걸 멈추지 마라"는 뜻. -->
<script src="fx.js?v=1" defer></script>

<style>
/* 이 페이지에서만 쓰는 것들 */

/* ---------- 트랙 목록 ---------- */
.row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  padding:9px 12px;
  border:none;
  border-left:3px solid transparent;
  background:none;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
}
.row.dead{ color:var(--phos-dim); }     /* 파일을 못 찾은 트랙 */

.num{ font-size:12px; opacity:.75; width:26px; flex:none; }
.name{ flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* 장르 태그: 밝기를 한 단계 낮춰서 제목에 안 밀리게 한다 */
.gen{
  font-size:11px;
  flex:none;
  max-width:45%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--phos-dim);
  border:1px solid var(--phos-dim);
  padding:1px 6px;
  letter-spacing:.04em;
}
.row.sel .gen{ color:var(--screen); border-color:var(--screen); opacity:.8; }

.tag{ font-size:12px; flex:none; width:56px; text-align:right; }

/* 재생 중인 줄에 붙는 막대 3개 */
.eq{ display:none; gap:2px; align-items:flex-end; height:13px; flex:none; }
.row.now .eq{ display:flex; }
.eq i{ width:3px; background:currentColor; animation:bounce .9s ease-in-out infinite; }
.eq i:nth-child(1){ height:40%; animation-delay:0s; }
.eq i:nth-child(2){ height:95%; animation-delay:.2s; }
.eq i:nth-child(3){ height:60%; animation-delay:.4s; }
@keyframes bounce{ 50%{ transform:scaleY(.35); } }

/* ---------- 플레이어 ---------- */
.player{ margin-top:16px; padding-top:12px; border-top:1px solid var(--phos-dim); }
.status{
  display:flex; justify-content:space-between; gap:12px;
  font-size:12px; color:var(--phos-mid); margin-bottom:8px;
}
.status .cur{ color:var(--phos); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status .err{ color:var(--amber); text-shadow:0 0 6px var(--amber); }

.track{
  height:8px;
  background:rgba(12,122,62,.35);
  border:1px solid var(--phos-dim);
  cursor:pointer;
}
.fill{ height:100%; width:0; background:var(--phos); }

.ctrl{ display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }

/* ---------- 볼륨 ---------- */
.vol{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:var(--phos-mid);
}
.seg{ display:flex; gap:2px; cursor:pointer; }
.seg i{
  width:9px; height:14px;
  border:1px solid var(--phos-dim);
  background:transparent;
}
.seg i.on{ background:var(--phos); border-color:var(--phos); }
.vol.muted .seg i.on{ background:var(--phos-dim); border-color:var(--phos-dim); }
.vol.muted .pct{ color:var(--amber); text-shadow:0 0 6px var(--amber); }
.pct{ width:38px; text-align:right; }

.hint{
  margin-top:10px;
  font-size:11px;
  color:var(--phos-dim);
  line-height:1.6;
}

/* 공통 .note 보다 조금 작게 */
.note{ margin-top:6px; font-size:11px; color:var(--phos-dim); }

@media (prefers-reduced-motion: reduce){ .eq i{ animation:none; } }

@media (max-width:520px){
  .name{ font-size:14px; }
  .tag{ display:none; }        /* 좁은 화면에선 상태 대신 장르를 남긴다 */
  .gen{ max-width:38%; }
  .vol{ margin-left:0; width:100%; }
}
</style>
</head>
<body>

<main class="screen">

  <div class="top">
    <div class="ttl">AUDIO ARCHIVE</div>
    <a class="back" href="index.html">◀ BACK</a>
  </div>

  <div class="head">&gt; 7 tracks found</div>

  <!-- data-file 에는 파일 이름만 적는다.
       폴더 이름은 아래 스크립트의 DIR 한 곳에만 있음. -->
  <div id="list">
    <button class="row" data-file="01_hazy_afterlight.mp3">
      <span class="num">001</span>
      <span class="name">HAZY AFTERLIGHT</span>
      <span class="gen">AMBIENT, ARTCORE</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="02_clear_blue_sky.mp3">
      <span class="num">002</span>
      <span class="name">CLEAR BLUE SKY</span>
      <span class="gen">CINEMATIC, ARTCORE</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="03_containment_failure.mp3">
      <span class="num">003</span>
      <span class="name">CONTAINMENT FAILURE(귀갱주의)</span>
      <span class="gen">INDUSTRIAL METAL</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="04_its_rainy_outside.mp3">
      <span class="num">004</span>
      <span class="name">IT'S RAINY OUTSIDE</span>
      <span class="gen">LOFI</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="05_soaring_through_the_air.mp3">
      <span class="num">005</span>
      <span class="name">SOARING THROUGH THE AIR</span>
      <span class="gen">ORCHESTRAL, ARTCORE</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="06_th06_boss_battle.mp3">
      <span class="num">006</span>
      <span class="name">TH99 BOSS BATTLE maybe(귀갱주의)</span>
      <span class="gen">IDK bro what is this shit</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
    <button class="row" data-file="07_merry_merchants_shop.mp3">
      <span class="num">007</span>
      <span class="name">THE MERRY MERCHANT'S SHOP</span>
      <span class="gen">FOLK</span>
      <span class="eq"><i></i><i></i><i></i></span>
      <span class="tag">[PLAY]</span>
    </button>
  </div>

  <div class="player">
    <div class="status">
      <span class="cur" id="nowPlaying">&gt; standby</span>
      <span id="time">--:-- / --:--</span>
    </div>

    <div class="track" id="track"><div class="fill" id="fill"></div></div>

    <div class="ctrl">
      <button class="btn" id="prev">◀◀</button>
      <button class="btn" id="toggle">▶</button>
      <button class="btn" id="next">▶▶</button>

      <div class="vol" id="vol">
        <span>VOL</span>
        <span class="seg" id="seg"></span>
        <span class="pct" id="pct">70%</span>
        <button class="btn" id="mute" style="padding:3px 8px;font-size:12px">M</button>
      </div>
    </div>

    <div class="hint">
      ↑↓ select · ENTER play · SPACE pause · ←→ seek 5s · + / − volume · M mute
    </div>
    <p class="note"><b>###</b> 일부 곡들은 소리가 크면 귀가 아플 수 있으니 미리 볼륨을 조정하는 걸 추천</p>
  </div>

</main>

<script>
/* =========================================================
   ★ mp3 들어있는 폴더 이름. 폴더를 옮기거나 이름을 바꿨으면
     여기 한 줄만 고치면 7곡 전부 따라온다.
     끝에 슬래시(/) 빼먹지 말 것.
   ========================================================= */
const DIR = "song_list/";


const audio = new Audio();
audio.preload = "none";

const rows = Array.from(document.querySelectorAll('.row'));
const nowPlaying = document.getElementById('nowPlaying');
const timeEl  = document.getElementById('time');
const fill    = document.getElementById('fill');
const trackEl = document.getElementById('track');
const toggleBtn = document.getElementById('toggle');

let sel = 0;
let cur = -1;

/* 각 줄의 실제 파일 경로를 만들어주는 함수.
   폴더 + 파일이름 을 붙이는 게 전부다. */
function pathOf(i){
  return DIR + rows[i].dataset.file;
}

/* =========================================================
   볼륨 — audio.volume 은 0 ~ 1 사이의 소수
   ========================================================= */
const STEPS = 10;
const segEl = document.getElementById('seg');
const pctEl = document.getElementById('pct');
const volEl = document.getElementById('vol');

let volume = 0.7;
try{
  const saved = localStorage.getItem('nv-vol');
  if(saved !== null) volume = Number(saved);
}catch(e){}

let muted = false;

for(let i = 0; i < STEPS; i++){
  const cell = document.createElement('i');
  cell.addEventListener('click', () => setVol((i + 1) / STEPS));
  segEl.appendChild(cell);
}

function setVol(v){
  volume = Math.min(1, Math.max(0, v));
  muted = false;
  applyVol();
}

function applyVol(){
  audio.volume = volume;
  audio.muted = muted;

  const lit = Math.round(volume * STEPS);
  segEl.querySelectorAll('i').forEach((cell, i) => cell.classList.toggle('on', i < lit));

  volEl.classList.toggle('muted', muted);
  pctEl.textContent = muted ? 'MUTE' : Math.round(volume * 100) + '%';

  try{ localStorage.setItem('nv-vol', volume); }catch(e){}
}
applyVol();

document.getElementById('mute').addEventListener('click', () => {
  muted = !muted;
  applyVol();
});

/* =========================================================
   목록 표시
   ========================================================= */
function draw(){
  rows.forEach((r, i) => {
    r.classList.toggle('sel', i === sel);
    r.classList.toggle('now', i === cur && !audio.paused);
    r.querySelector('.tag').textContent =
      i === cur ? (audio.paused ? '[PAUSE]' : '[NOW]') : '[PLAY]';
  });
  toggleBtn.textContent = audio.paused ? '▶' : '❚❚';
}

function move(step){
  sel = (sel + step + rows.length) % rows.length;
  draw();
}

/* =========================================================
   재생
   ========================================================= */
function play(i){
  cur = i;
  sel = i;
  rows[i].classList.remove('dead');
  audio.src = pathOf(i);
  applyVol();
  audio.play().catch(() => {});
  nowPlaying.textContent = '> ' + rows[i].querySelector('.name').textContent;
  nowPlaying.classList.remove('err');
  draw();
}

function toggle(){
  if(cur < 0){ play(sel); return; }
  if(audio.paused) audio.play().catch(() => {});
  else audio.pause();
  draw();
}

function fmt(sec){
  if(!isFinite(sec)) return '--:--';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

audio.addEventListener('timeupdate', () => {
  const ratio = audio.duration ? audio.currentTime / audio.duration : 0;
  fill.style.width = (ratio * 100) + '%';
  timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
});

audio.addEventListener('play', draw);
audio.addEventListener('pause', draw);

audio.addEventListener('ended', () => {
  if(cur < rows.length - 1) play(cur + 1);
  else{
    cur = -1;
    fill.style.width = '0';
    nowPlaying.textContent = '> standby';
    draw();
  }
});

/* 파일을 못 찾으면 어떤 경로를 찾으려 했는지 화면에 그대로 보여준다.
   이게 있어야 폴더 이름이 틀렸을 때 바로 알아챌 수 있음. */
audio.addEventListener('error', () => {
  if(cur < 0) return;
  rows[cur].classList.add('dead');
  nowPlaying.textContent = '> FILE NOT FOUND: ' + pathOf(cur);
  nowPlaying.classList.add('err');
  timeEl.textContent = '--:-- / --:--';
  fill.style.width = '0';
  cur = -1;
  draw();
});

/* =========================================================
   조작
   ========================================================= */
rows.forEach((row, i) => {
  row.addEventListener('mouseenter', () => { sel = i; draw(); });
  row.addEventListener('click', () => { i === cur ? toggle() : play(i); });
});

document.getElementById('prev').addEventListener('click', () => play(cur <= 0 ? rows.length - 1 : cur - 1));
document.getElementById('next').addEventListener('click', () => play(cur < 0 || cur === rows.length - 1 ? 0 : cur + 1));
toggleBtn.addEventListener('click', toggle);

trackEl.addEventListener('click', e => {
  if(!audio.duration) return;
  const box = trackEl.getBoundingClientRect();
  audio.currentTime = ((e.clientX - box.left) / box.width) * audio.duration;
});

document.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown' || e.key === 's'){ e.preventDefault(); move(1); }
  if(e.key === 'ArrowUp'   || e.key === 'w'){ e.preventDefault(); move(-1); }
  if(e.key === 'Enter'){ e.preventDefault(); play(sel); }
  if(e.key === ' '){ e.preventDefault(); toggle(); }
  if(e.key === 'ArrowRight') audio.currentTime += 5;
  if(e.key === 'ArrowLeft')  audio.currentTime -= 5;
  if(e.key === '+' || e.key === '=') setVol(volume + 0.1);
  if(e.key === '-' || e.key === '_') setVol(volume - 0.1);
  if(e.key === 'm' || e.key === 'M'){ muted = !muted; applyVol(); }
});

draw();
</script>
</body>
</html>
