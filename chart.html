<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NV / CHART EDITOR</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">

<!-- 색과 폰트만 가져다 쓴다.
     fx.js(지직 효과)는 일부러 안 붙였다. 채보 찍을 땐 화면이 흔들리면 방해된다. -->
<link rel="stylesheet" href="style.css?v=3">

<style>
/* 이 페이지는 도구라서 .screen 대신 넓은 판을 쓴다 */
body{ align-items:flex-start; padding:14px; }

.panel{
  width:min(920px, 100%);
  margin:0 auto;
  background:var(--screen);
  border:2px solid var(--phos-dim);
  border-radius:12px;
  padding:16px 18px 18px;
  text-shadow:0 0 6px currentColor;
}

.bar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 0;
  border-bottom:1px solid rgba(12,122,62,.45);
}
.bar:last-of-type{ border-bottom:none; }

.lbl{ font-size:11px; color:var(--phos-dim); letter-spacing:.06em; }

input[type=number], input[type=text], select, textarea{
  font:inherit; font-size:13px;
  background:#031008;
  color:var(--phos);
  border:1px solid var(--phos-dim);
  padding:4px 7px;
}
input[type=number]{ width:84px; }
textarea{ width:100%; height:90px; resize:vertical; font-size:11px; }

.btn.on{ background:var(--phos); color:var(--screen); text-shadow:none; }
.btn.amber{ border-color:var(--amber); color:var(--amber); }
.btn.amber:hover{ background:var(--amber); color:var(--screen); }
.btn:disabled{ opacity:.35; cursor:default; }

/* ---------- 시간 막대 ---------- */
.seek{
  position:relative;
  height:22px;
  background:rgba(12,122,62,.22);
  border:1px solid var(--phos-dim);
  cursor:pointer;
  margin:10px 0 4px;
}
.seek .played{ position:absolute; inset:0 auto 0 0; width:0; background:rgba(44,255,136,.28); }
.seek .region{ position:absolute; top:0; bottom:0; background:rgba(255,182,60,.18); border-left:1px solid var(--amber); border-right:1px solid var(--amber); }
.seek .head{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--phos); }

/* ---------- 노트 미리보기 ---------- */
#view{ display:block; width:100%; height:330px; background:#020806; border:1px solid var(--phos-dim); }

.stat{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--phos-mid); margin-top:8px; }
.stat b{ color:var(--phos); font-weight:400; }

.help{ font-size:11px; color:var(--phos-dim); line-height:1.7; margin-top:10px; }
.help kbd{ color:var(--phos-mid); border:1px solid var(--phos-dim); padding:0 4px; }

.msg{ font-size:12px; color:var(--amber); min-height:16px; margin-top:6px; }

@media (max-width:560px){
  #view{ height:250px; }
  .panel{ padding:12px; }
}
</style>
</head>
<body>

<div class="panel">

  <div class="top">
    <div class="ttl">CHART EDITOR</div>
    <a class="back" href="index.html">◀ BACK</a>
  </div>

  <!-- ---------- 1줄: 곡 ---------- -->
  <div class="bar">
    <span class="lbl">SONG</span>
    <select id="song"></select>
    <button class="btn" id="loadBtn">LOAD</button>
    <span class="lbl" id="dur">--:--</span>
  </div>

  <!-- ---------- 2줄: 박자 ---------- -->
  <div class="bar">
    <span class="lbl">BPM</span>
    <input type="number" id="bpm" value="180" min="40" max="400" step="0.1">
    <button class="btn" id="tapBtn">TAP <span id="tapN"></span></button>

    <span class="lbl">OFFSET</span>
    <input type="number" id="offset" value="0" step="0.001">
    <button class="btn" id="offBtn">SET HERE</button>
    <button class="btn amber" id="detBtn">DETECT A~B</button>
  </div>

  <!-- ---------- 3줄: 찍기 설정 ---------- -->
  <div class="bar">
    <span class="lbl">SNAP</span>
    <button class="btn snap" data-div="1">1/1</button>
    <button class="btn snap on" data-div="2">1/2</button>
    <button class="btn snap" data-div="4">1/4</button>
    <button class="btn snap" data-div="8">1/8</button>
    <button class="btn snap" data-div="0">OFF</button>

    <span class="lbl" style="margin-left:8px">SPEED</span>
    <button class="btn rate" data-rate="0.5">.5</button>
    <button class="btn rate" data-rate="0.75">.75</button>
    <button class="btn rate on" data-rate="1">1.0</button>

    <button class="btn" id="metroBtn" style="margin-left:8px">METRONOME</button>
  </div>

  <!-- ---------- 키 설정 ---------- -->
  <div class="bar">
    <span class="lbl">KEYS</span>
    <button class="btn keyb" data-i="0">A</button>
    <button class="btn keyb" data-i="1">S</button>
    <button class="btn keyb" data-i="2">;</button>
    <button class="btn keyb" data-i="3">'</button>
    <span class="lbl" id="bindHint">버튼을 누른 뒤 원하는 키를 치면 바뀐다</span>
  </div>

  <!-- ---------- 4줄: 구간 ---------- -->
  <div class="bar">
    <span class="lbl">REGION</span>
    <input type="number" id="rStart" value="0" step="0.1"> <span class="lbl">~</span>
    <input type="number" id="rEnd" value="0" step="0.1">
    <button class="btn" id="rSetA">A = HERE</button>
    <button class="btn" id="rSetB">B = HERE</button>
    <button class="btn" id="rGo">JUMP TO A</button>
  </div>

  <div class="seek" id="seek">
    <div class="played" id="played"></div>
    <div class="region" id="regionBox"></div>
    <div class="head" id="head"></div>
  </div>

  <canvas id="view"></canvas>

  <!-- ---------- 자동 생성 ---------- -->
  <div class="bar">
    <span class="lbl">AUTO</span>
    <button class="btn amber" id="autoBtn">GENERATE A~B</button>

    <span class="lbl">감도</span>
    <input type="number" id="sens" value="1.35" min="1" max="3" step="0.05">

    <span class="lbl">최소간격</span>
    <select id="gap">
      <option value="1">1박</option>
      <option value="0.5" selected>1/2박</option>
      <option value="0.25">1/4박</option>
    </select>

    <label class="lbl" style="display:flex;align-items:center;gap:5px">
      <input type="checkbox" id="wipe" checked> 기존 노트 지우고
    </label>
  </div>

  <div class="stat">
    <span>NOTES <b id="nCount">0</b></span>
    <span>TIME <b id="nTime">00:00.000</b></span>
    <span>BEAT <b id="nBeat">–</b></span>
    <span>LAST <b id="nLast">–</b></span>
  </div>

  <!-- ---------- 출력 ---------- -->
  <div class="bar" style="margin-top:10px">
    <button class="btn" id="undoBtn">UNDO</button>
    <button class="btn" id="delBtn">DEL NEAR</button>
    <button class="btn amber" id="clearBtn">CLEAR ALL</button>
    <button class="btn" id="exportBtn" style="margin-left:auto">EXPORT .json</button>
    <button class="btn" id="copyBtn">COPY</button>
  </div>

  <div class="bar">
    <span class="lbl">IMPORT — 여기에 JSON 붙여넣고 LOAD JSON</span>
    <button class="btn" id="importBtn">LOAD JSON</button>
  </div>
  <textarea id="io" placeholder="{ &quot;bpm&quot;: 180, &quot;notes&quot;: [[1.2, 0]] }"></textarea>

  <div class="msg" id="msg"></div>

  <div class="help">
    <span id="helpKeys">A S ; '</span> 노트 찍기 (재생 중에만) ·
    <kbd>SPACE</kbd> 재생/정지 ·
    <kbd>BACKSPACE</kbd> 마지막 노트 취소 ·
    <kbd>T</kbd> 탭 템포 ·
    <kbd>←</kbd><kbd>→</kbd> 1초 이동 ·
    <kbd>[</kbd><kbd>]</kbd> 한 박자 이동<br>
    작업 내용은 자동으로 저장된다. 새로고침해도 안 날아간다.
  </div>

</div>

<script>
/* =========================================================
   ★ 고치고 싶을 만한 값들
   ========================================================= */
const CFG = {
  DIR: 'song_list/',        // mp3 폴더
  LANES: 4,                 // 레인 수
  KEYS: ['a','s',';',"'"],  // 레인별 기본 키. 순서가 곧 레인 번호 0,1,2,3
                            // (화면의 REBIND 로 바꾸면 그게 우선한다)

  LOOKAHEAD: 1.9,           // 판정선 위로 몇 초 앞까지 보여줄지
  PAST: 0.45,               // 판정선 아래로 몇 초 지난 것까지 보여줄지

  TAP_RESET: 2.0,           // 탭 템포: 이 시간 이상 쉬면 처음부터 다시
  METRO_VOL: 0.3,           // 메트로놈 크기
  SCHED_AHEAD: 0.12,        // 메트로놈을 몇 초 앞까지 미리 예약할지
  SCHED_TICK: 25,           // 예약 담당이 도는 간격(ms)

  SAVE_KEY: 'nv-chart-draft',

  /* ---------- 자동 생성 ----------
     소리가 갑자기 커지는 순간을 찾아서 노트를 찍는다 */
  AUTO_FFT: 1024,      // 한 번에 분석할 샘플 수. 2의 거듭제곱만 가능
  AUTO_HOP: 512,       // 분석 간격. 작을수록 정밀하지만 느려진다
  AUTO_WIN: 14,        // 주변 몇 칸의 평균과 비교할지
  AUTO_LO: 60,         // 레인 배치에 쓸 최저 주파수(Hz) → 맨 왼쪽
  AUTO_HI: 6000        // 레인 배치에 쓸 최고 주파수(Hz) → 맨 오른쪽
};

/* 목록에 띄울 곡들 */
const SONGS = [
  '01_hazy_afterlight.mp3',
  '02_clear_blue_sky.mp3',
  '03_containment_failure.mp3',
  '04_its_rainy_outside.mp3',
  '05_soaring_through_the_air.mp3',
  '06_th06_boss_battle.mp3',
  '07_merry_merchants_shop.mp3'
];


/* =========================================================
   상태
   ========================================================= */
const audio = new Audio();
audio.preload = 'auto';

let notes = [];        // [[시간(초), 레인], ...] — 항상 시간순 정렬 유지
let bpm = 180;
let offset = 0;        // 첫 박자가 시작하는 시각(초)
let snapDiv = 2;       // 0 = 스냅 끔, 1 = 4분음표, 2 = 8분음표, 4 = 16분음표
let rate = 1;
let metroOn = false;

let flash = [0,0,0,0]; // 노트 찍을 때 반짝이는 잔상

const $ = id => document.getElementById(id);


/* =========================================================
   곡 목록
   ========================================================= */
SONGS.forEach(f => {
  const o = document.createElement('option');
  o.value = f;
  o.textContent = f.replace(/\.mp3$/, '');
  $('song').appendChild(o);
});
$('song').value = '06_th06_boss_battle.mp3';

function loadSong(){
  audio.src = CFG.DIR + $('song').value;
  audio.load();
  say('loading ' + $('song').value);
}
$('loadBtn').addEventListener('click', loadSong);

audio.addEventListener('loadedmetadata', () => {
  $('dur').textContent = fmt(audio.duration);
  if(Number($('rEnd').value) === 0) $('rEnd').value = audio.duration.toFixed(1);
  say('ready');
});
audio.addEventListener('error', () => say('FILE NOT FOUND: ' + audio.src));


/* =========================================================
   메트로놈

   소리를 "지금 내라"고 하면 항상 조금씩 늦는다.
   그래서 미리 앞을 내다보고 "몇 초 뒤에 내라"고 예약해둔다.
   이걸 룩어헤드 스케줄러라고 부른다.
   ========================================================= */
let actx = null;
let metroNext = 0;     // 다음에 예약할 박자 번호

function ensureCtx(){
  if(actx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(AC) actx = new AC();
}

function click(when, strong){
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.frequency.value = strong ? 1600 : 950;   // 마디 첫 박만 높게
  g.gain.setValueAtTime(CFG.METRO_VOL, when);
  g.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
  osc.connect(g).connect(actx.destination);
  osc.start(when);
  osc.stop(when + 0.06);
}

setInterval(() => {
  if(!metroOn || audio.paused || !actx) return;

  const now = audio.currentTime;
  const beat = 60 / bpm;

  let n = Math.ceil((now - offset) / beat);
  if(n < metroNext) n = metroNext;

  // 재생 속도를 늦추면 실제 시간도 그만큼 늘어난다
  const horizon = now + CFG.SCHED_AHEAD * rate;

  while(true){
    const t = offset + n * beat;
    if(t > horizon) break;
    if(t >= now) click(actx.currentTime + (t - now) / rate, ((n % 4) + 4) % 4 === 0);
    n++;
  }
  metroNext = n;
}, CFG.SCHED_TICK);

$('metroBtn').addEventListener('click', () => {
  ensureCtx();
  if(actx && actx.state === 'suspended') actx.resume();
  metroOn = !metroOn;
  metroNext = 0;
  $('metroBtn').classList.toggle('on', metroOn);
});


/* =========================================================
   박자 계산
   ========================================================= */
function beatLen(){ return 60 / bpm; }

/* 스냅: 가장 가까운 격자 칸으로 붙인다.
   사람이 손으로 친 건 아무리 잘 쳐도 20~50ms 씩 어긋나는데,
   이걸 그대로 두면 게임에서 노트가 미묘하게 흔들린다. */
function snap(t){
  if(!snapDiv) return t;
  const step = beatLen() / snapDiv;
  return offset + Math.round((t - offset) / step) * step;
}

function beatNoOf(t){
  return (t - offset) / beatLen();
}


/* =========================================================
   노트 넣고 빼기
   ========================================================= */
function addNote(rawT, lane){
  const t = snap(rawT);

  // 같은 레인 같은 자리에 이미 있으면 무시 (연타로 두 번 들어가는 것 방지)
  const dup = notes.some(n => n[1] === lane && Math.abs(n[0] - t) < 0.012);
  if(dup) return;

  notes.push([t, lane]);
  notes.sort((a, b) => a[0] - b[0]);

  flash[lane] = 1;
  refresh();
}

function undo(){
  if(!notes.length) return;
  // 재생 위치보다 앞에 있는 것 중 제일 마지막 것을 뺀다
  let idx = -1, best = -Infinity;
  const now = audio.currentTime + 0.05;
  notes.forEach((n, i) => { if(n[0] <= now && n[0] > best){ best = n[0]; idx = i; } });
  if(idx < 0) idx = notes.length - 1;
  notes.splice(idx, 1);
  refresh();
}

/* 재생 위치 근처(한 칸 이내) 노트를 전부 지운다 */
function delNear(){
  const w = snapDiv ? beatLen() / snapDiv * 0.6 : 0.08;
  const now = audio.currentTime;
  const before = notes.length;
  notes = notes.filter(n => Math.abs(n[0] - now) > w);
  say('removed ' + (before - notes.length));
  refresh();
}


/* =========================================================
   저장 / 불러오기
   ========================================================= */
function chartObj(){
  return {
    song: CFG.DIR + $('song').value,
    bpm: bpm,
    offset: Number(offset.toFixed(4)),
    start: Number($('rStart').value),
    end: Number($('rEnd').value),
    notes: notes.map(n => [Number(n[0].toFixed(4)), n[1]])
  };
}

function save(){
  try{ localStorage.setItem(CFG.SAVE_KEY, JSON.stringify(chartObj())); }catch(e){}
}

function load(){
  try{
    const raw = localStorage.getItem(CFG.SAVE_KEY);
    if(raw) apply(JSON.parse(raw), true);
  }catch(e){}
}

function apply(o, quiet){
  if(!o) return;
  if(o.song){
    const f = String(o.song).split('/').pop();
    if(SONGS.includes(f)) $('song').value = f;
  }
  if(o.bpm)    $('bpm').value    = o.bpm;
  if(o.offset != null) $('offset').value = o.offset;
  if(o.start  != null) $('rStart').value = o.start;
  if(o.end    != null) $('rEnd').value   = o.end;

  notes = Array.isArray(o.notes)
    ? o.notes.filter(n => Array.isArray(n) && n.length >= 2).map(n => [Number(n[0]), Number(n[1])])
    : [];
  notes.sort((a, b) => a[0] - b[0]);

  readInputs();
  loadSong();
  refresh();
  if(!quiet) say('loaded ' + notes.length + ' notes');
}

$('importBtn').addEventListener('click', () => {
  try{ apply(JSON.parse($('io').value)); }
  catch(e){ say('JSON 형식이 잘못됐다: ' + e.message); }
});

$('copyBtn').addEventListener('click', () => {
  const s = JSON.stringify(chartObj());
  $('io').value = s;
  $('io').select();
  try{ navigator.clipboard.writeText(s); say('copied'); }
  catch(e){ say('아래 칸에서 직접 복사해라'); }
});

$('exportBtn').addEventListener('click', () => {
  const s = JSON.stringify(chartObj(), null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([s], {type:'application/json'}));
  a.download = $('song').value.replace(/\.mp3$/, '') + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  say('exported');
});

$('clearBtn').addEventListener('click', () => {
  if(!confirm('노트를 전부 지운다. 진짜?')) return;
  notes = [];
  refresh();
});


/* =========================================================
   탭 템포 — 박자에 맞춰 두드리면 BPM 을 역산한다
   ========================================================= */
let taps = [];

function tap(){
  const now = performance.now() / 1000;
  if(taps.length && now - taps[taps.length - 1] > CFG.TAP_RESET) taps = [];
  taps.push(now);
  if(taps.length > 9) taps.shift();

  $('tapN').textContent = taps.length > 1 ? '(' + taps.length + ')' : '';

  if(taps.length >= 3){
    const span = taps[taps.length - 1] - taps[0];
    const got = 60 / (span / (taps.length - 1));
    $('bpm').value = got.toFixed(1);
    readInputs();
  }
}
$('tapBtn').addEventListener('click', tap);


/* =========================================================
   입력칸 읽기
   ========================================================= */
function readInputs(){
  bpm = Math.max(20, Number($('bpm').value) || 180);
  offset = Number($('offset').value) || 0;
  refresh();
}
['bpm','offset','rStart','rEnd'].forEach(id =>
  $(id).addEventListener('input', readInputs));

$('offBtn').addEventListener('click', () => {
  $('offset').value = audio.currentTime.toFixed(3);
  readInputs();
  say('offset = ' + audio.currentTime.toFixed(3));
});

document.querySelectorAll('.snap').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.snap').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  snapDiv = Number(b.dataset.div);
}));

document.querySelectorAll('.rate').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.rate').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  rate = Number(b.dataset.rate);
  audio.playbackRate = rate;
  metroNext = 0;
}));

/* =========================================================
   키 배열 바꾸기

   사람마다 쓰는 손가락 배열이 다르다. (as;' / dfjk / sdkl ...)
   바꾼 값은 저장해두고 다음에 들어와도 그대로 쓴다.
   ========================================================= */
const KEY_SAVE = 'nv-chart-keys';

/* 이 키들은 다른 기능이 이미 쓰고 있어서 레인에 못 준다 */
const RESERVED = [' ', 'backspace', 't', 'arrowleft', 'arrowright', '[', ']', 'enter', 'escape', 'tab'];

let bindIdx = -1;   // 지금 어떤 레인의 키를 기다리는 중인지. -1 이면 대기 아님

try{
  const saved = JSON.parse(localStorage.getItem(KEY_SAVE) || 'null');
  if(Array.isArray(saved) && saved.length === CFG.LANES) CFG.KEYS = saved;
}catch(e){}

function keyLabel(k){
  if(k === ' ') return 'SPC';
  return k.length === 1 ? k.toUpperCase() : k;
}

function drawKeys(){
  document.querySelectorAll('.keyb').forEach(b => {
    const i = Number(b.dataset.i);
    b.textContent = (bindIdx === i) ? '...' : keyLabel(CFG.KEYS[i]);
    b.classList.toggle('on', bindIdx === i);
  });
  $('helpKeys').textContent = CFG.KEYS.map(keyLabel).join(' ');
}

document.querySelectorAll('.keyb').forEach(b => b.addEventListener('click', () => {
  bindIdx = Number(b.dataset.i);

  $('bindHint').textContent = '원하는 키를 지금 눌러라 (ESC 취소)';
  drawKeys();
}));

function bindKey(k){
  if(k === 'escape'){ bindIdx = -1; $('bindHint').textContent = '취소됨'; drawKeys(); return; }

  if(RESERVED.includes(k)){
    $('bindHint').textContent = '그 키는 다른 기능이 쓰고 있다';
    return;                     // 계속 기다린다
  }
  const dup = CFG.KEYS.indexOf(k);
  if(dup >= 0 && dup !== bindIdx){
    $('bindHint').textContent = '이미 ' + (dup + 1) + '번 레인이 쓰는 키다';
    return;
  }

  CFG.KEYS[bindIdx] = k;
  bindIdx = -1;
  $('bindHint').textContent = 'OK';
  try{ localStorage.setItem(KEY_SAVE, JSON.stringify(CFG.KEYS)); }catch(e){}
  drawKeys();
}

/* =========================================================
   자동 생성

   흐름:
     1. mp3 를 통째로 받아서 숫자 배열(파형)로 푼다
     2. 아주 짧은 토막으로 잘라서 각 토막의 주파수 분포를 구한다
     3. 앞 토막보다 "커진 정도"를 전부 더한다 = 변화량
     4. 변화량이 주변 평균보다 확 튀는 지점 = 소리가 시작된 순간
     5. 그 지점들을 격자에 붙이고 레인을 나눠준다

   ★ 이건 초안이다. 기계는 "소리가 났다"만 알지
     "그게 칠 만한가"는 모른다. 반드시 손으로 다듬어야 한다.
   ========================================================= */

/* ---------- FFT ----------
   소리 토막 하나를 주파수별 세기로 바꾸는 계산.
   내용을 이해할 필요는 없다. 교과서에 나오는 그대로다. */
function fft(re, im){
  const n = re.length;

  for(let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for(; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if(i < j){
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }

  for(let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    const half = len >> 1;
    for(let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for(let k = 0; k < half; k++){
        const ur = re[i+k], ui = im[i+k];
        const vr = re[i+k+half] * cr - im[i+k+half] * ci;
        const vi = re[i+k+half] * ci + im[i+k+half] * cr;
        re[i+k] = ur + vr;       im[i+k] = ui + vi;
        re[i+k+half] = ur - vr;  im[i+k+half] = ui - vi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr;
        cr = ncr;
      }
    }
  }
}

/* 디코딩은 오래 걸리니 한 번 한 곡은 기억해둔다 */
let decoded = { src: '', buf: null };

async function getBuffer(){
  if(decoded.src === audio.src && decoded.buf) return decoded.buf;

  const res = await fetch(audio.src);
  if(!res.ok) throw new Error('파일을 못 읽었다 (' + res.status + ')');
  const raw = await res.arrayBuffer();

  const buf = await actx.decodeAudioData(raw);
  decoded = { src: audio.src, buf: buf };
  return buf;
}

/* ---------- 구간의 변화량 곡선을 구한다 ----------
   자동 생성과 BPM 측정이 같이 쓴다. */
function fluxOf(buf, A, B, wantCentroid){
  const sr = buf.sampleRate;
  const N = CFG.AUTO_FFT, HOP = CFG.AUTO_HOP;

  const ch0 = buf.getChannelData(0);
  const ch1 = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;

  const from = Math.max(0, Math.floor((A - 0.3) * sr));
  const to   = Math.min(buf.length, Math.ceil((B + 0.3) * sr));

  const win = new Float32Array(N);
  for(let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);

  const re = new Float32Array(N), im = new Float32Array(N);
  const prev = new Float32Array(N / 2);
  const flux = [], cent = [];

  for(let s = from; s + N < to; s += HOP){
    for(let i = 0; i < N; i++){
      const v = ch1 ? (ch0[s+i] + ch1[s+i]) * 0.5 : ch0[s+i];
      re[i] = v * win[i];
      im[i] = 0;
    }
    fft(re, im);

    let sum = 0, wsum = 0, msum = 0;
    for(let k = 1; k < N / 2; k++){
      const mag = Math.sqrt(re[k]*re[k] + im[k]*im[k]);
      const d = mag - prev[k];
      if(d > 0) sum += d;                // 커진 것만. 줄어든 건 무시
      prev[k] = mag;

      if(wantCentroid){
        const f = k * sr / N;
        if(f >= CFG.AUTO_LO && f <= CFG.AUTO_HI){ wsum += f * mag; msum += mag; }
      }
    }
    flux.push(sum);
    cent.push(msum > 0 ? wsum / msum : CFG.AUTO_LO);
  }

  return { flux: flux, cent: cent, t0: from / sr, fps: sr / HOP };
}

/* 국소 평균을 빼서 "조용한 데는 다 놓치고 시끄러운 데는 다 걸리는" 편향을 없앤다 */
function sharpen(flux, w){
  const out = new Float32Array(flux.length);
  let mx = 0;
  for(let i = 0; i < flux.length; i++){
    let s = 0, c = 0;
    for(let j = Math.max(0, i - w); j <= Math.min(flux.length - 1, i + w); j++){ s += flux[j]; c++; }
    const v = Math.max(0, flux[i] - s / c);
    out[i] = v;
    if(v > mx) mx = v;
  }
  if(mx > 0) for(let i = 0; i < out.length; i++) out[i] /= mx;
  return out;
}


/* =========================================================
   BPM / OFFSET 자동 측정

   격자를 후보 BPM 마다 깔아보고, 격자 선 위에 변화량이
   가장 많이 얹히는 조합을 고른다. 맞는 BPM 이면 박자가
   격자에 딱 올라타서 점수가 튄다.
   ========================================================= */
function gridScore(f, fps, t0, bpm, off, A, B){
  const beat = 60 / bpm;
  const k0 = Math.ceil((A - off) / beat);
  const k1 = Math.floor((B - off) / beat);
  if(k1 <= k0) return 0;

  let sum = 0, n = 0;
  for(let k = k0; k <= k1; k++){
    const idx = (off + k * beat - t0) * fps;
    const i = Math.floor(idx);
    if(i < 0 || i + 1 >= f.length) continue;
    const fr = idx - i;
    sum += f[i] * (1 - fr) + f[i+1] * fr;
    n++;
  }
  return n ? sum / n : 0;
}

async function detectTempo(){
  ensureCtx();
  if(!actx){ say('이 브라우저에서는 안 된다'); return; }
  if(actx.state === 'suspended') await actx.resume();

  const A = Number($('rStart').value), B = Number($('rEnd').value);
  if(!(B - A >= 8)){ say('구간이 너무 짧다. 최소 8초는 잡아라'); return; }

  $('detBtn').disabled = true;
  say('측정 중...');

  try{
    const buf = await getBuffer();
    await new Promise(r => setTimeout(r, 30));

    const a = fluxOf(buf, A, B, false);
    const f = sharpen(a.flux, CFG.AUTO_WIN * 3);

    /* 후보 주변을 촘촘히 훑어 최적점을 찾는다 */
    const fine = (c, span, step) => {
      let b = { s: -1, bpm: c, off: A };
      for(let bpm = c - span; bpm <= c + span; bpm += step){
        if(bpm < 40) continue;
        const beat = 60 / bpm;
        for(let o = 0; o < beat; o += 0.002){
          const s = gridScore(f, a.fps, a.t0, bpm, A + o, A, B);
          if(s > b.s) b = { s: s, bpm: bpm, off: A + o };
        }
      }
      return b;
    };

    // 1차: 넓게 훑는다
    let best = { s: -1, bpm: 120, off: A };
    for(let bpm = 60; bpm <= 240; bpm += 0.25){
      const beat = 60 / bpm;
      for(let o = 0; o < beat; o += beat / 40){
        const s = gridScore(f, a.fps, a.t0, bpm, A + o, A, B);
        if(s > best.s) best = { s: s, bpm: bpm, off: A + o };
      }
    }

    // 2차: 그 주변만 촘촘히
    best = fine(best.bpm, 0.6, 0.01);

    /* ---------- 3차: 배수 접기 ----------
       ★ 이걸 안 하면 거의 항상 절반 값이 나온다.
         느린 격자는 강한 박자만 골라 밟기 때문에
         "격자 한 칸당 평균 점수"가 오히려 높게 나온다.
         그래서 2배로 늘려봤을 때 점수가 크게 안 떨어지면
         사실 그쪽이 진짜 박자다. */
    const FOLD = 0.55;
    for(let i = 0; i < 3; i++){
      const c = best.bpm * 2;
      if(c > 240) break;
      const b2 = fine(c, 0.8, 0.01);
      if(b2.s >= best.s * FOLD || best.bpm < 100) best = b2;
      else break;
    }

    // 오프셋을 곡 맨 앞 기준으로 되돌린다 (격자는 offset + n*beat 이므로)
    const beat = 60 / best.bpm;
    const off0 = ((best.off % beat) + beat) % beat;

    $('bpm').value = best.bpm.toFixed(2);
    $('offset').value = off0.toFixed(3);
    readInputs();

    say('BPM ' + best.bpm.toFixed(2) + ' / offset ' + off0.toFixed(3)
        + ' · 선명도 ' + best.s.toFixed(3) + (best.s < 0.12 ? ' (낮다 — 구간을 바꿔봐라)' : ''));

  }catch(err){
    say('실패: ' + err.message);
  }finally{
    $('detBtn').disabled = false;
  }
}

$('detBtn').addEventListener('click', detectTempo);


async function autoGen(){
  ensureCtx();
  if(!actx){ say('이 브라우저에서는 자동 생성이 안 된다'); return; }
  if(actx.state === 'suspended') await actx.resume();

  const A = Number($('rStart').value);
  const B = Number($('rEnd').value);
  if(!(B > A)){ say('REGION 을 먼저 정해라 (A < B)'); return; }

  $('autoBtn').disabled = true;
  say('디코딩 중... 곡이 길면 몇 초 걸린다');

  try{
    const buf = await getBuffer();
    await new Promise(r => setTimeout(r, 30));      // 화면이 멈춘 것처럼 보이지 않게
    say('분석 중...');

    /* 변화량 곡선을 구한다 (레인 배치용 무게중심도 같이) */
    const a = fluxOf(buf, A, B, true);
    const flux = a.flux, cent = a.cent;

    /* ---------- 봉우리 찾기 ----------
       고정된 기준값을 쓰면 조용한 부분은 다 놓치고
       시끄러운 부분은 전부 걸린다.
       그래서 "주변 평균보다 몇 배인가"로 본다. */
    const SENS = Math.max(1, Number($('sens').value) || 1.35);
    const W = CFG.AUTO_WIN;
    const minGap = beatLen() * Number($('gap').value);

    const hits = [];
    let lastT = -1e9;

    for(let i = 1; i < flux.length - 1; i++){
      if(flux[i] <= flux[i-1] || flux[i] < flux[i+1]) continue;   // 봉우리가 아님

      let sum = 0, cnt = 0;
      for(let j = Math.max(0, i - W); j <= Math.min(flux.length - 1, i + W); j++){ sum += flux[j]; cnt++; }
      const mean = sum / cnt;
      if(mean <= 0 || flux[i] < mean * SENS) continue;

      const t = a.t0 + i / a.fps;
      if(t < A || t > B) continue;
      if(t - lastT < minGap) continue;

      lastT = t;
      hits.push([t, cent[i]]);
    }

    /* ---------- 레인 배치 ----------
       낮은 소리는 왼쪽, 높은 소리는 오른쪽.

       ★ 주파수 절대값으로 나누면 안 된다.
         꽉 찬 곡은 무게중심이 죄다 2~3kHz 에 몰려서
         전부 오른쪽 레인 하나로 쏠린다.
         그래서 "이 곡 안에서 몇 등인가"(순위)로 나눈다.
         그러면 네 레인에 고르게 퍼진다. */
    const sorted = hits.map(h => h[1]).sort((p, q) => p - q);
    const rankOf = c => {
      let lo = 0, hi = sorted.length;
      while(lo < hi){ const m = (lo + hi) >> 1; if(sorted[m] < c) lo = m + 1; else hi = m; }
      return sorted.length ? lo / sorted.length : 0;
    };

    const made = [];
    let prevLane = -1;

    for(const [t, c] of hits){
      let lane = Math.min(CFG.LANES - 1, Math.floor(rankOf(c) * CFG.LANES));

      /* 같은 레인 연타는 재미없으니 한 칸 옆으로 민다.
         ★ 끝 레인에서 반대쪽 끝으로 넘기면(3→0) 손이 건반을 가로지른다.
           그래서 가장자리는 안쪽으로만 민다. */
      if(lane === prevLane){
        if(lane === 0) lane = 1;
        else if(lane === CFG.LANES - 1) lane = CFG.LANES - 2;
        else lane = lane + 1;
      }
      prevLane = lane;

      made.push([snap(t), lane]);
    }

    /* ---------- 합치기 ---------- */
    if($('wipe').checked) notes = notes.filter(n => n[0] < A || n[0] > B);

    for(const m of made){
      const dup = notes.some(n => n[1] === m[1] && Math.abs(n[0] - m[0]) < 0.012);
      if(!dup) notes.push(m);
    }
    notes.sort((a, b) => a[0] - b[0]);
    refresh();

    const secs = B - A;
    say('노트 ' + made.length + '개 생성 · 초당 ' + (made.length / secs).toFixed(1) + '개 · 이제 손으로 다듬어라');

  }catch(err){
    say('실패: ' + err.message);
  }finally{
    $('autoBtn').disabled = false;
  }
}

$('autoBtn').addEventListener('click', autoGen);

/* =========================================================
   재생 조작
   ========================================================= */
function playPause(){
  ensureCtx();
  if(actx && actx.state === 'suspended') actx.resume();
  if(audio.paused){
    audio.playbackRate = rate;
    metroNext = 0;
    audio.play().catch(() => say('재생 실패 — LOAD 를 먼저 눌러라'));
  }else{
    audio.pause();
  }
}

function seek(t){
  if(!isFinite(audio.duration)) return;
  audio.currentTime = Math.min(audio.duration, Math.max(0, t));
  metroNext = 0;
}

$('seek').addEventListener('click', e => {
  if(!isFinite(audio.duration)) return;
  const box = $('seek').getBoundingClientRect();
  seek((e.clientX - box.left) / box.width * audio.duration);
});


/* =========================================================
   키보드

   ★ e.timeStamp 가 이 에디터의 핵심이다.
     키를 누른 "진짜 시각"은 브라우저가 이벤트에 적어준 timeStamp 고,
     우리 함수가 실행되는 시점은 그보다 몇 ms 늦다.
     그 차이를 빼줘야 실제로 누른 순간의 음악 위치가 나온다.
   ========================================================= */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;  // 입력칸에선 무시
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.repeat) return;                                                   // 누르고 있는 건 한 번만

  const k = e.key.toLowerCase();

  /* 키 바꾸는 중이면 다른 건 전부 무시하고 이것부터 처리한다 */
  if(bindIdx >= 0){
    e.preventDefault();
    bindKey(k);
    return;
  }

  const lane = CFG.KEYS.indexOf(k);
  if(lane >= 0){
    e.preventDefault();
    if(audio.paused) return;                     // 멈춰 있을 땐 안 찍는다
    const lag = Math.max(0, performance.now() - e.timeStamp) / 1000;
    addNote(audio.currentTime - lag * rate, lane);
    return;
  }

  if(k === ' '){ e.preventDefault(); playPause(); }
  if(k === 'backspace'){ e.preventDefault(); undo(); }
  if(k === 't'){ e.preventDefault(); tap(); }
  if(k === 'arrowright'){ e.preventDefault(); seek(audio.currentTime + 1); }
  if(k === 'arrowleft'){  e.preventDefault(); seek(audio.currentTime - 1); }
  if(k === ']'){ e.preventDefault(); seek(audio.currentTime + beatLen()); }
  if(k === '['){ e.preventDefault(); seek(audio.currentTime - beatLen()); }
});


/* =========================================================
   화면 그리기
   ========================================================= */
const cv = $('view');
const g = cv.getContext('2d');
let W = 0, H = 0, color = {};

function readColors(){
  const cs = getComputedStyle(document.documentElement);
  const get = (n, d) => (cs.getPropertyValue(n).trim() || d);
  color = {
    phos: get('--phos','#2CFF88'),
    mid:  get('--phos-mid','#17B85F'),
    dim:  get('--phos-dim','#0C7A3E'),
    amber:get('--amber','#FFB63C')
  };
}

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const box = cv.getBoundingClientRect();
  W = Math.max(1, Math.round(box.width));
  H = Math.max(1, Math.round(box.height));
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
readColors();
resize();

function draw(){
  requestAnimationFrame(draw);

  const now = audio.currentTime;
  const lineY = H - 54;                          // 판정선 위치
  const pps = (lineY - 10) / CFG.LOOKAHEAD;      // 1초당 몇 픽셀 내려오는지
  const lw = W / CFG.LANES;

  g.clearRect(0, 0, W, H);

  // 레인 칸막이
  g.strokeStyle = 'rgba(12,122,62,.5)';
  g.lineWidth = 1;
  for(let i = 1; i < CFG.LANES; i++){
    g.beginPath(); g.moveTo(i * lw, 0); g.lineTo(i * lw, H); g.stroke();
  }

  // 박자 격자
  const step = beatLen() / (snapDiv || 1);
  if(step > 0.02){
    let n = Math.floor((now - CFG.PAST - offset) / step);
    for(;; n++){
      const t = offset + n * step;
      if(t > now + CFG.LOOKAHEAD) break;
      const y = lineY - (t - now) * pps;
      if(y < -2 || y > H + 2) continue;

      const b = beatNoOf(t);
      const isBeat = Math.abs(b - Math.round(b)) < 1e-6;
      const isBar  = isBeat && ((Math.round(b) % 4) + 4) % 4 === 0;

      g.strokeStyle = isBar ? 'rgba(44,255,136,.45)'
                    : isBeat ? 'rgba(23,184,95,.30)'
                             : 'rgba(12,122,62,.18)';
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
  }

  // 구간 표시
  const ra = Number($('rStart').value), rb = Number($('rEnd').value);
  [ra, rb].forEach((t, i) => {
    const y = lineY - (t - now) * pps;
    if(y < 0 || y > H) return;
    g.strokeStyle = color.amber;
    g.setLineDash([6,4]);
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    g.setLineDash([]);
    g.fillStyle = color.amber;
    g.font = '11px monospace';
    g.fillText(i ? 'B' : 'A', 4, y - 4);
  });

  // 노트
  const nh = 11;
  for(const [t, lane] of notes){
    if(t < now - CFG.PAST || t > now + CFG.LOOKAHEAD) continue;
    const y = lineY - (t - now) * pps;
    const x = lane * lw + 5;

    const past = t < now;
    g.fillStyle = past ? color.dim : color.phos;
    g.fillRect(x, y - nh / 2, lw - 10, nh);
  }

  // 판정선
  g.strokeStyle = color.amber;
  g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, lineY); g.lineTo(W, lineY); g.stroke();
  g.lineWidth = 1;

  // 키 표시 + 방금 찍은 잔상
  g.font = '13px monospace';
  g.textAlign = 'center';
  for(let i = 0; i < CFG.LANES; i++){
    if(flash[i] > 0){
      g.fillStyle = 'rgba(44,255,136,' + (flash[i] * 0.35) + ')';
      g.fillRect(i * lw + 2, lineY, lw - 4, H - lineY);
      flash[i] = Math.max(0, flash[i] - 0.06);
    }
    g.fillStyle = color.mid;
    g.fillText(keyLabel(CFG.KEYS[i]), i * lw + lw / 2, H - 16);
  }
  g.textAlign = 'left';

  // 아래쪽 정보
  $('nTime').textContent = fmt(now, true);
  const b = beatNoOf(now);
  $('nBeat').textContent = isFinite(b) ? (Math.floor(b / 4) + 1) + ' : ' + (((Math.floor(b) % 4) + 4) % 4 + 1) : '–';

  if(isFinite(audio.duration)){
    $('played').style.width = (now / audio.duration * 100) + '%';
    $('head').style.left = (now / audio.duration * 100) + '%';
    const L = Math.max(0, ra) / audio.duration * 100;
    const R = Math.min(audio.duration, rb) / audio.duration * 100;
    $('regionBox').style.left = L + '%';
    $('regionBox').style.width = Math.max(0, R - L) + '%';
  }
}
draw();


/* =========================================================
   잡다한 것
   ========================================================= */
function fmt(s, ms){
  if(!isFinite(s)) return '--:--';
  const m = Math.floor(s / 60);
  const sec = s % 60;
  const base = String(m).padStart(2,'0') + ':' + String(Math.floor(sec)).padStart(2,'0');
  return ms ? base + '.' + String(Math.floor((sec % 1) * 1000)).padStart(3,'0') : base;
}

function say(t){ $('msg').textContent = t; }

let saveTimer = 0;
function refresh(){
  $('nCount').textContent = notes.length;
  const last = notes[notes.length - 1];
  $('nLast').textContent = last ? fmt(last[0], true) + ' / ' + keyLabel(CFG.KEYS[last[1]]) : '–';

  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);   // 너무 자주 저장하면 느려진다
}

$('undoBtn').addEventListener('click', undo);
$('delBtn').addEventListener('click', delNear);

readInputs();
load();
if(!audio.src) loadSong();
</script>
